<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantéMada - Accueil</title>
    <link rel="stylesheet" href="acceuil.css">
  </head>

  <body>

    <!-- 1. LA BARRE DU HAUT -->
    <header>
      <a href="acceuil.html" class="logo">SantéMada</a>
      <nav>
        <a href="acceuil.html">Rechercher</a>
        <a href="connexion.html" id="lien-connexion">Se connecter</a>
      </nav>
    </header>

    <!-- 2. LE CONTENU PRINCIPAL -->
    <main>

      <!-- Le bandeau vert : titre et recherche -->
      <section class="bandeau">
        <h1>Trouvez un professionnel de santé</h1>
        <p>Cherchez un médecin, un établissement ou une spécialité.</p>

        <form class="recherche">
          <input type="text" id="champ-recherche" placeholder="Cardiologue, pédiatre, hôpital...">

          <select id="filtre-region">
            <option value="">Toutes les régions</option>
            <option value="Analamanga">Analamanga</option>
            <option value="Amoron'i Mania">Amoron'i Mania</option>
            <option value="Haute Matsiatra">Haute Matsiatra</option>
          </select>

          <select id="filtre-specialite">
            <option value="">Toutes les spécialités</option>
            <option value="Pédiatrie">Pédiatrie</option>
            <option value="Cardiologie">Cardiologie</option>
            <option value="Médecine générale">Médecine générale</option>
            <option value="Gynécologie">Gynécologie</option>
          </select>

          <button>Rechercher</button>
        </form>
      </section>

      <!-- La liste des médecins : la grille est vide, JavaScript la remplit -->
      <h2>Professionnels disponibles</h2>
      <p id="message"></p>

      <div class="liste" id="liste"></div>

    </main>

    <!-- 3. LE PIED DE PAGE -->
    <footer>
      <p>© 2026 SantéMada · Madagascar</p>
    </footer>

    <!-- 4. LES SCRIPTS : les partagés d'abord, celui de la page en dernier -->
    <script src="session.js"></script>
    <script src="medecins.js"></script>
    <script src="acceuil.js"></script>

  </body>
</html>
